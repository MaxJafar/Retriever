name: Feature request
description: Describe a Retriever workflow you want to improve.
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: "Describe the workflow and where it becomes difficult. Avoid personal documents or private device details."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: "Explain the behavior you would find useful, including platform or multi-device needs."
