name: Native checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      RETRIEVER_AGENT_STATE: ${{ github.workspace }}/artifacts/test-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - name: Select the macOS 26 SDK for Liquid Glass
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - run: python release/validate.py
      - run: python -m unittest discover -s release -p test_*.py
      - name: Use isolated fixture temporary folders
        shell: python
        run: |
          import os, pathlib
          tmp = pathlib.Path("artifacts/test-tmp").resolve()
          tmp.mkdir(parents=True, exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a") as out:
              for key in ["TMP", "TEMP", "TMPDIR"]:
                  out.write(f"{key}={tmp}\n")
      - run: cargo test --locked --release --manifest-path retriever-rs/Cargo.toml --workspace -j 2 -- --test-threads=2
      - run: cargo build --locked --release --manifest-path retriever-rs/Cargo.toml -p retriever -p retriever-agent -p retriever-updater -j 2
      - name: Verify engine update lifecycle
        shell: python
        run: |
          import os, pathlib, subprocess
          engine = pathlib.Path("retriever-rs/target/release/retriever" + (".exe" if os.name == "nt" else ""))
          subprocess.run(["python", "release/smoke.py", "--engine", str(engine), "--output", "artifacts/lifecycle-smoke"], check=True)
      - if: runner.os == 'Windows'
        name: Check folder integration upgrade with in-memory registry
        shell: pwsh
        run: dotnet run --project native/retriever-windows-tests -c Release -- artifacts/folder-upgrade-tests
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/retriever-windows/build.ps1 -OutputDirectory artifacts/native-check
      - if: runner.os == 'macOS'
        run: |
          export RETRIEVER_ENGINE="$PWD/retriever-rs/target/release/retriever"
          export RETRIEVER_UPDATER="$PWD/retriever-rs/target/release/retriever-updater"
          export RETRIEVER_BUILD_OUT="$PWD/artifacts/native-check/Retriever.app"
          sh native/retriever-macos/build.sh
