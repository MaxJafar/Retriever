[workspace]
resolver = "2"
members = ["crates/protocol", "crates/engine", "crates/cli", "crates/agent", "crates/embedding-native", "crates/updater"]

[workspace.package]
version = "0.13.0-alpha.21-native"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
memmap2 = "0.9"
parking_lot = "0.12"
quick-xml = "0.38"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
retriever-protocol = { path = "crates/protocol" }
retriever-engine = { path = "crates/engine" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
